[package]
name = "artcraft-cloud-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "artcraftCloud drive and app host, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
artcraft-cloud-types = { path = "../types" }
js-sys = "0.3"
leptos = { version = "0.7", default-features = false, features = ["csr"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "BeforeUnloadEvent",
    "console",
    "Document",
    "DomTokenList",
    "DragEvent",
    "DataTransfer",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FormData",
    "Headers",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlIFrameElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "Node",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "Url",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
