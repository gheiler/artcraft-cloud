{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "artcraft-cloud.fullname" . }}
  labels: {{- include "artcraft-cloud.labels" . | nindent 4 }}
  annotations:
    # Large documents and WebDAV uploads.
    nginx.ingress.kubernetes.io/proxy-body-size: "{{ .Values.maxUploadMB }}m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "artcraft-cloud.fullname" . }}
                port:
                  name: http
{{- end }}
