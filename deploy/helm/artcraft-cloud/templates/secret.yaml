{{- if and (not .Values.admin.existingSecret) (or .Values.admin.password .Values.githubToken) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artcraft-cloud.fullname" . }}
  labels: {{- include "artcraft-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.admin.password }}
  password: {{ . | quote }}
  {{- end }}
  {{- with .Values.githubToken }}
  githubToken: {{ . | quote }}
  {{- end }}
{{- end }}
